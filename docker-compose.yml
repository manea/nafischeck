services:
  nafischeck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nafischeck
    restart: unless-stopped
    ports:
      - "127.0.0.1:4219:4219"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4219
      NAFISCHECK_DATA_DIR: /app/data
      BASE_PATH: ${BASE_PATH:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - nafischeck_data:/app/data

volumes:
  nafischeck_data:
